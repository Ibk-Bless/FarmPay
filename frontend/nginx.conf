server {
  listen 8080;
  root /usr/share/nginx/html;

  # The API lives in the backend container. The browser only ever talks to this server.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }

  # Hashed build assets never change, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else is the single-page app (client-side routes such as /order/3).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
