name: Feature request
description: Suggest an improvement for buyers, farmers or cooperatives
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected (buyer, farmer, cooperative, contributor) and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work. Note if it changes the contract, since contract changes need a spec update and a new deployment.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits the current scope in the README (or I've explained why the scope should change)
